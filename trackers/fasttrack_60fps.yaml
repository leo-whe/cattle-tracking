# FastTracker for 59.94 fps footage (preset `default` at 60 fps; Texas ranch flights).
# Frame-count knobs are scaled to the 60 fps time base, and track_buffer is 2 s
# (120 frames) so an animal briefly lost to occlusion or the frame edge is recovered.
tracker_type: fasttrack
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
track_buffer: 120
match_thresh: 0.80
fuse_score: true
reset_velocity_offset_occ: 10
reset_pos_offset_occ: 6
enlarge_bbox_occ: 1.1
dampen_motion_occ: 0.5
active_occ_to_lost_thresh: 20
occ_reappear_window: 160
init_iou_suppress: 0.7
